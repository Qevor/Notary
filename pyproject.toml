[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notary-on-arc"
version = "0.1.0"
description = "Autonomous legal witness and payment intelligence terminal on Arc."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NOTARY" }]
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "langgraph>=0.2.0",
  "langchain>=0.2.0",
  "eth-account>=0.13.0",
  "eth-utils>=4.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["notary*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"
